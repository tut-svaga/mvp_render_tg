name: XAUUSD release

on:
  workflow_dispatch:
    inputs:
      release_date:
        description: "Release date (YYYY-MM-DD)"
        required: true
        type: string
      release_time:
        description: "Release time in Europe/Chisinau"
        required: true
        default: "15:30"
        type: string

permissions:
  contents: read

concurrency:
  group: xauusd-release-${{ inputs.release_date }}-${{ inputs.release_time }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify scraper checkout
        run: |
          test -d forexfactory-scraper || (echo "::error::forexfactory-scraper directory is missing"; exit 1)
          test -f forexfactory-scraper/update.py || (echo "::error::forexfactory-scraper/update.py is missing"; exit 1)

      - name: Run release orchestrator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_SER: ${{ secrets.TELEGRAM_CHAT_ID_SER }}
        run: |
          python orchestrator.py \
            --release-date "${{ inputs.release_date }}" \
            --release-time "${{ inputs.release_time }}" \
            --timezone "Europe/Chisinau"
