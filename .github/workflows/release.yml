name: XAUUSD release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Isolated end-to-end test or real release"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - release
      release_date:
        description: "Release date (YYYY-MM-DD)"
        required: true
        default: "2026-11-25"
        type: string
      release_time:
        description: "Release time in Europe/Chisinau (test default: 01:10)"
        required: true
        default: "01:10"
        type: string

permissions:
  contents: read

concurrency:
  group: xauusd-${{ inputs.mode }}-${{ inputs.release_date }}-${{ inputs.release_time }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            forexfactory-scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r forexfactory-scraper/requirements.txt

      - name: Verify scraper source
        run: |
          test -f forexfactory-scraper/update.py
          test -f forexfactory-scraper/src/forexfactory/main.py

      - name: Run watcher regression tests
        run: python -m unittest discover -s tests -v

      - name: Run isolated end-to-end test through production orchestrator
        if: inputs.mode == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_SER: ${{ secrets.TELEGRAM_CHAT_ID_SER }}
        run: |
          python orchestrator.py \
            --mode test \
            --release-date "${{ inputs.release_date }}" \
            --release-time "${{ inputs.release_time }}" \
            --timezone "Europe/Chisinau" \
            --poll-seconds 60 \
            --max-wait-minutes 75 \
            --test-checkpoint-seconds 10 \
            --test-release-gap-seconds 5

      - name: Run real release orchestrator
        if: inputs.mode == 'release'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_SER: ${{ secrets.TELEGRAM_CHAT_ID_SER }}
        run: |
          python orchestrator.py \
            --mode release \
            --release-date "${{ inputs.release_date }}" \
            --release-time "${{ inputs.release_time }}" \
            --timezone "Europe/Chisinau" \
            --poll-seconds 60 \
            --max-wait-minutes 75
